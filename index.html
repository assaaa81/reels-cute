<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Cinta Interaktif</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f4f4f4;
    }
    .hidden { display: none; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <!-- STEP 1: Lokasi -->
  <div id="step1">
    <h1>Website Bosen-bosenan 😴</h1>
    <p>Tekan tombol di bawah untuk memulai</p>
    <button onclick="startLocation()">Mulai</button>
    <div id="locationResult"></div>
  </div>

  <!-- STEP 2: Tebak-Tebakan -->
  <div id="step2" class="hidden">
    <h2>Tebak-Tebakan Cinta 💘</h2>
    <p id="tebakan"></p>
    <button id="jawabanBtn" onclick="showJawaban()">Klik untuk melihat jawaban</button>
    <p id="jawaban" class="hidden"></p>
    <button id="nextTebakanBtn" class="hidden" onclick="nextTebakan()">Lanjut ➡️</button>
  </div>

  <!-- STEP 3: Quiz -->
  <div id="step3" class="hidden">
    <h2>Quiz Cinta 🥰</h2>
    <p>Kalau kamu lihat orang yang kamu suka, kamu bakal?</p>
    <div><input type="radio" name="quiz" /> A. Senyum doang 😅</div>
    <div><input type="radio" name="quiz" /> B. Chat terus 💬</div>
    <div><input type="radio" name="quiz" /> C. Diam-diam stalking 👀</div>
    <div><input type="radio" name="quiz" /> D. Langsung nembak 😎</div>
    <button onclick="showGambar()">Lihat Hasil Cinta Kamu</button>
  </div>

  <!-- STEP 4: Gambar Emoji -->
  <div id="step4" class="hidden">
    <h2>Gambaran Cinta Kamu Hari Ini:</h2>
    <div id="emoji" style="font-size: 3rem;"></div>
  </div>

  <script>
    // Step 1: Lokasi
    function startLocation() {
      const res = document.getElementById("locationResult");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(5);
            const lon = position.coords.longitude.toFixed(5);
            res.innerHTML = `AI menebak kamu sedang di koordinat:<br><strong>${lat}, ${lon}</strong>`;
            setTimeout(() => {
              document.getElementById("step1").classList.add("hidden");
              document.getElementById("step2").classList.remove("hidden");
              loadTebakan();
            }, 1500);
          },
          () => {
            res.innerHTML = "Gagal mendapatkan lokasi 😢";
          }
        );
      } else {
        res.innerHTML = "Browser kamu tidak mendukung fitur lokasi.";
      }
    }

    // Step 2: Tebak-tebakan
    const tebakanList = [
      ["Apa bedanya kamu sama jam?", "Jam terus berdetak, kalau kamu terus di hatiku ❤️"],
      ["Kenapa hati kamu kayak kos-kosan?", "Karena aku pengen ngekos selamanya 😆"],
      ["Kalau kamu jadi angka, kamu bakal jadi?", "Angka satu, karena kamu nomor satu di hati 🥇"],
      ["Kamu tahu nggak kenapa aku nggak bisa tidur?", "Karena kepikiran kamu terus 😴❤️"],
      ["Kenapa aku suka hujan?", "Soalnya pas hujan aku bisa pura-pura nyari kamu ☔💕"]
    ];
    let currentTebakan = 0;

    function loadTebakan() {
      document.getElementById("tebakan").innerText = tebakanList[currentTebakan][0];
      document.getElementById("jawaban").classList.add("hidden");
      document.getElementById("jawabanBtn").classList.remove("hidden");
      document.getElementById("nextTebakanBtn").classList.add("hidden");
    }

    function showJawaban() {
      document.getElementById("jawaban").innerText = tebakanList[currentTebakan][1];
      document.getElementById("jawaban").classList.remove("hidden");
      document.getElementById("jawabanBtn").classList.add("hidden");
      document.getElementById("nextTebakanBtn").classList.remove("hidden");
    }

    function nextTebakan() {
      currentTebakan++;
      if (currentTebakan < tebakanList.length) {
        loadTebakan();
      } else {
        document.getElementById("step2").classList.add("hidden");
        document.getElementById("step3").classList.remove("hidden");
      }
    }

    // Step 4: Emoji Cinta
    function showGambar() {
      document.getElementById("step3").classList.add("hidden");
      document.getElementById("step4").classList.remove("hidden");
      const emojis = ["💘", "💌", "❤️", "😍", "🌹", "💕"];
      const chosen = emojis[Math.floor(Math.random() * emojis.length)];
      document.getElementById("emoji").innerText = chosen;
    }
  </script>

</body>
</html>
